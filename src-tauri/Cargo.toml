[package]
name = "github-desktop-tauri"
version = "3.6.7-beta4"
description = "GitHub Desktop, rewritten on Tauri"
authors = ["GitHub, Inc."]
license = "MIT"
repository = "https://github.com/desktop/desktop.git"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` enables Manager::get_window, needed for native context menus.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OAuth token exchange happens here instead of in the webview: GitHub's
# /login/oauth/access_token sends no CORS headers for the app origin.
ureq = "2"
# Falls back to the Windows system proxy (IE/WinINET settings) when the
# HTTP(S)_PROXY env vars are absent, e.g. when launched from Explorer.
winreg = "0.55"
log = "0.4"
trash = "5"
